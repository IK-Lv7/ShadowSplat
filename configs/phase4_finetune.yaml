# Phase 4: pseudo labels and SegFormer-B0 fine-tuning
pseudo_label:
  teacher: segformer_b5_cityscapes     # SegFormer-B5 from SEGFORMER_REPO / SEGFORMER_CKPT (.env)
  teacher_input: [576, 1024]           # rendered images (533x300) are upscaled for the teacher (H, W)
  label_size: [512, 1024]              # student (B0) input resolution; same as phase1_model.yaml
  min_confidence: 0.7                  # pixels whose teacher max probability is below this are ignored (255)
  out_subdir: pseudo                   # <job_dir>/pseudo/offset_*/frame_*.png
finetune:
  base_model: nvidia/segformer-b0-finetuned-cityscapes-1024-1024   # same as models/segformer.py
  train_frame_fraction: 0.7     # train on renders of the first 70% of the scene; keep the last 30% of real frames for evaluation
  epochs: 5
  batch_size: 8
  lr: 2.0e-5
  weight_decay: 0.01
  brightness_jitter: [0.7, 1.3]
  seed: 0
  out_dir: data/phase4/finetune     # <out_dir>/<job>/{b0_finetuned.pt, train.log, history.json}
eval:
  heldout_gap_sec: 2.0              # gap between the end of the training interval and the evaluation interval (avoids near-duplicate frames)
                                    # evaluation interval = real front-camera frames after (training end + gap)
  forgetting_scene: scene-0061      # daytime scene, used to check that the original behaviour is kept
  forgetting_stride: 4
  out_dir: data/phase4/eval
